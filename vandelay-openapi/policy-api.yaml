openapi: 3.0.3
info:
  title: Vandelay Policy API
  version: 1.0.0
  description: |
    Read policy details, coverages, insured vehicles, and drivers, and verify coverage for a loss.

    The Claims API calls `POST /policies/v1/policies/{policyId}/coverage-verifications` when a claim is created to confirm
    the policy was active on the loss date and which coverages and deductibles apply.
    ### Authentication and rate limits
    - Send `Authorization: Bearer <token>`; see `bearerAuth` for the token format and personas.
    - Each token is limited to 600 requests per minute. Responses include `X-RateLimit-Limit` and `X-RateLimit-Remaining`;
      over the limit you receive `429` with `Retry-After`.
    - No scopes are required: any valid token can call every operation.
  contact:
    name: Vandelay API Platform Team
    email: api-platform@vandelay-industries.example
  license:
    name: Proprietary
servers:
  - url: https://api.vandelay-industries.example
    description: Production
  - url: https://api.staging.vandelay-industries.example
    description: Staging
security:
  - bearerAuth: []
tags:
  - name: Policies
    description: Policy records.
  - name: Coverages
    description: Coverages, limits, and deductibles.
  - name: Vehicles
    description: Insured vehicles.
  - name: Drivers
    description: Listed drivers.
  - name: Coverage Verification
    description: Verify coverage for a loss.
paths:
  /policies/v1/policies:
    get:
      tags: [Policies]
      operationId: listPolicies
      summary: List policies
      parameters:
        - name: customerId
          in: query
          description: Filter by policyholder.
          schema: { type: string }
          example: cus_01HX9K
        - name: status
          in: query
          description: Filter by status.
          schema: { $ref: '#/components/schemas/PolicyStatus' }
          example: active
        - name: vin
          in: query
          description: Find policies insuring this VIN.
          schema: { type: string }
          example: 1HGCM82633A004352
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Policies.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyList' }
              examples:
                activePolicies:
                  value:
                    data:
                      - id: pol_AUT-882145
                        policyNumber: AUT-882145
                        customerId: cus_01HX9K
                        product: personal_auto
                        status: active
                        effectiveDate: '2026-03-01'
                        expirationDate: '2027-03-01'
                        premium: { amount: 1480.00, currency: USD }
                        billingFrequency: monthly
                    nextCursor: null
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /policies/v1/policies/{policyId}:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [Policies]
      operationId: getPolicy
      summary: Get a policy
      description: Returns the policy with its coverages, vehicles, and drivers.
      responses:
        '200':
          description: The policy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PolicyDetail' }
              examples:
                policy:
                  value:
                    id: pol_AUT-882145
                    policyNumber: AUT-882145
                    customerId: cus_01HX9K
                    product: personal_auto
                    status: active
                    effectiveDate: '2026-03-01'
                    expirationDate: '2027-03-01'
                    premium: { amount: 1480.00, currency: USD }
                    billingFrequency: monthly
                    coverages:
                      - code: COLL
                        name: Collision
                        limit: { amount: 50000.00, currency: USD }
                        deductible: { amount: 500.00, currency: USD }
                      - code: COMP
                        name: Comprehensive
                        limit: { amount: 50000.00, currency: USD }
                        deductible: { amount: 250.00, currency: USD }
                      - code: BI
                        name: Bodily Injury Liability
                        limit: { amount: 100000.00, currency: USD }
                      - code: PD
                        name: Property Damage Liability
                        limit: { amount: 50000.00, currency: USD }
                      - code: UM
                        name: Uninsured Motorist Bodily Injury
                        limit: { amount: 100000.00, currency: USD }
                      - code: MED
                        name: Medical Payments
                        limit: { amount: 5000.00, currency: USD }
                      - code: RENT
                        name: Rental Reimbursement
                        limit: { amount: 1200.00, currency: USD }
                        dailyLimit: { amount: 40.00, currency: USD }
                    vehicles:
                      - id: veh_7731
                        vin: 1HGCM82633A004352
                        year: 2022
                        make: Honda
                        model: Accord
                    drivers:
                      - id: drv_301
                        firstName: Marisol
                        lastName: Vega
                        licenseState: NC
                        relationship: self
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/v1/policies/{policyId}/coverages:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [Coverages]
      operationId: listPolicyCoverages
      summary: List policy coverages
      responses:
        '200':
          description: Coverages on the policy.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Coverage' }
              examples:
                coverages:
                  value:
                    data:
                      - code: COLL
                        name: Collision
                        limit: { amount: 50000.00, currency: USD }
                        deductible: { amount: 500.00, currency: USD }
                      - code: COMP
                        name: Comprehensive
                        limit: { amount: 50000.00, currency: USD }
                        deductible: { amount: 250.00, currency: USD }
                      - code: BI
                        name: Bodily Injury Liability
                        limit: { amount: 100000.00, currency: USD }
                      - code: PD
                        name: Property Damage Liability
                        limit: { amount: 50000.00, currency: USD }
                      - code: UM
                        name: Uninsured Motorist Bodily Injury
                        limit: { amount: 100000.00, currency: USD }
                      - code: MED
                        name: Medical Payments
                        limit: { amount: 5000.00, currency: USD }
                      - code: RENT
                        name: Rental Reimbursement
                        limit: { amount: 1200.00, currency: USD }
                        dailyLimit: { amount: 40.00, currency: USD }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/v1/policies/{policyId}/vehicles:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [Vehicles]
      operationId: listPolicyVehicles
      summary: List insured vehicles
      responses:
        '200':
          description: Insured vehicles.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InsuredVehicle' }
              examples:
                vehicles:
                  value:
                    data:
                      - id: veh_7731
                        vin: 1HGCM82633A004352
                        year: 2022
                        make: Honda
                        model: Accord
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /policies/v1/policies/{policyId}/drivers:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    get:
      tags: [Drivers]
      operationId: listPolicyDrivers
      summary: List listed drivers
      responses:
        '200':
          description: Drivers.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Driver' }
              examples:
                drivers:
                  value:
                    data:
                      - id: drv_301
                        firstName: Marisol
                        lastName: Vega
                        licenseState: NC
                        relationship: self
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Drivers]
      operationId: addPolicyDriver
      summary: Add a driver
      description: Adds a driver; may trigger a premium recalculation.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DriverCreate' }
            examples:
              spouse:
                value:
                  firstName: Mateo
                  lastName: Vega
                  dateOfBirth: '1986-02-11'
                  licenseNumber: '45892017'
                  licenseState: NC
                  relationship: spouse
      responses:
        '201':
          description: Driver added.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Driver' }
              examples:
                created:
                  value:
                    id: drv_302
                    firstName: Mateo
                    lastName: Vega
                    licenseState: NC
                    relationship: spouse
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /policies/v1/policies/{policyId}/coverage-verifications:
    parameters:
      - $ref: '#/components/parameters/PolicyId'
    post:
      tags: [Coverage Verification]
      operationId: verifyCoverage
      summary: Verify coverage for a loss
      description: |
        Checks whether the policy and vehicle were covered on the loss date for the given claim type, and
        returns applicable coverage, limit, and deductible. A policy that is not covered returns
        `200` with `covered: false` and a `reasons` list. Use `404` only when the policy does not exist.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoverageVerificationRequest' }
            examples:
              collision:
                summary: Collision loss
                value:
                  lossDate: '2026-10-02'
                  claimType: collision
                  vehicleId: veh_7731
                  driverId: drv_301
      responses:
        '200':
          description: Verification result.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CoverageVerification' }
              examples:
                covered:
                  summary: Covered
                  value:
                    covered: true
                    policyId: pol_AUT-882145
                    lossDate: '2026-10-02'
                    coverage:
                      code: COLL
                      name: Collision
                      limit: { amount: 50000.00, currency: USD }
                      deductible: { amount: 500.00, currency: USD }
                    reasons: []
                    verifiedAt: '2026-10-02T18:21:06Z'
                notCovered:
                  summary: Not covered (policy lapsed)
                  value:
                    covered: false
                    policyId: pol_AUT-882145
                    lossDate: '2026-10-02'
                    reasons:
                      - code: POLICY_LAPSED
                        message: Policy was not active on the loss date.
                    verifiedAt: '2026-10-02T18:21:06Z'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        Static opaque bearer token. These are random strings, **not JWTs**, so there are no claims to decode
        (`bearerFormat` is informational). Send `Authorization: Bearer <token>`.

        Tokens look like `vdl_<environment>_<persona>_<random>` and are issued by the API owner, one per persona and
        per environment (Prod and Test use different tokens). The server maps each token to a persona with fixed scopes:

        | Persona | Acts as | Scopes |
        | --- | --- | --- |
        | agent | `agt_claims_assistant` (AI agent) | none |
        | adjuster | `adj_220` (Priya Raman) | `customers:pii:read`, `payments:write` |
        | supervisor | `adj_105` (Denise Okafor) | `customers:pii:read`, `customers:delete`, `payments:write`, `payments:approve` |
        | customer | `cus_01HX9K` (Marisol Vega) | none |

        A missing or unrecognized token returns `401`; a recognized token that lacks a required scope returns `403`.
        Agents obtain access through Passport references rather than raw tokens.
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of items to return.
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      example: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous response's `nextCursor`.
      schema: { type: string }
      example: eyJvIjoyMH0
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 'Unique key (UUID recommended) so retries do not create duplicate resources. Retrying with the same key and body returns the original response with `Idempotent-Replayed: true`; reusing a key with a different body is rejected.'
      schema: { type: string }
      example: 7c9e6679-7425-40de-944b-e07fc1f90ae7
    PolicyId:
      name: policyId
      in: path
      required: true
      description: Unique policy ID.
      schema: { type: string, pattern: '^pol_[A-Z]{3}-[0-9]+$' }
      example: pol_AUT-882145
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            validation:
              value:
                type: https://api.vandelay-industries.example/problems/validation-error
                title: Validation failed
                status: 400
                detail: Request body failed validation.
                errors:
                  - field: example
                    message: is required
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Unauthorized:
      description: Missing or invalid credentials.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            unauthorized:
              value:
                type: https://api.vandelay-industries.example/problems/unauthorized
                title: Unauthorized
                status: 401
                detail: Bearer token is missing, expired, or invalid.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Forbidden:
      description: The caller lacks the required scope.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            forbidden:
              value:
                type: https://api.vandelay-industries.example/problems/forbidden
                title: Forbidden
                status: 403
                detail: Token is missing the required scope.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            notFound:
              value:
                type: https://api.vandelay-industries.example/problems/not-found
                title: Resource not found
                status: 404
                detail: No resource exists with the given ID.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    Conflict:
      description: Conflict with current resource state or duplicate idempotency key.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            conflict:
              value:
                type: https://api.vandelay-industries.example/problems/conflict
                title: Conflict
                status: 409
                detail: The request conflicts with the current state of the resource.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema: { type: integer }
          example: 30
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          examples:
            rateLimited:
              value:
                type: https://api.vandelay-industries.example/problems/rate-limited
                title: Too many requests
                status: 429
                detail: Rate limit of 600 requests per minute exceeded.
                traceId: 4bf92f3577b34da6a3ce929d0e0e4736
  schemas:
    PolicyStatus:
      type: string
      enum: [quoted, active, lapsed, cancelled, expired]
    Policy:
      type: object
      required: [id, policyNumber, customerId, product, status, effectiveDate, expirationDate]
      properties:
        id: { type: string, example: pol_AUT-882145 }
        policyNumber: { type: string, example: AUT-882145 }
        customerId: { type: string, example: cus_01HX9K }
        product: { type: string, enum: [personal_auto, commercial_auto, motorcycle, classic_car] }
        status: { $ref: '#/components/schemas/PolicyStatus' }
        effectiveDate: { type: string, format: date }
        expirationDate: { type: string, format: date }
        premium: { $ref: '#/components/schemas/Money' }
        billingFrequency: { type: string, enum: [monthly, quarterly, semiannual, annual] }
    PolicyDetail:
      allOf:
        - $ref: '#/components/schemas/Policy'
        - type: object
          properties:
            coverages:
              type: array
              items: { $ref: '#/components/schemas/Coverage' }
            vehicles:
              type: array
              items: { $ref: '#/components/schemas/InsuredVehicle' }
            drivers:
              type: array
              items: { $ref: '#/components/schemas/Driver' }
    PolicyList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Policy' }
        nextCursor: { type: string, nullable: true }
    Coverage:
      type: object
      required: [code, name]
      properties:
        code: { type: string, example: COLL }
        name: { type: string, example: Collision }
        limit: { $ref: '#/components/schemas/Money' }
        deductible: { $ref: '#/components/schemas/Money' }
        dailyLimit: { $ref: '#/components/schemas/Money' }
    InsuredVehicle:
      type: object
      required: [id, vin, year, make, model]
      properties:
        id: { type: string, example: veh_7731 }
        vin: { type: string, example: 1HGCM82633A004352 }
        year: { type: integer, example: 2022 }
        make: { type: string, example: Honda }
        model: { type: string, example: Accord }
    Driver:
      type: object
      required: [id, firstName, lastName, relationship]
      properties:
        id: { type: string, example: drv_301 }
        firstName: { type: string }
        lastName: { type: string }
        licenseState: { type: string }
        relationship: { type: string, enum: [self, spouse, child, other] }
    DriverCreate:
      type: object
      required: [firstName, lastName, dateOfBirth, licenseNumber, licenseState, relationship]
      properties:
        firstName: { type: string }
        lastName: { type: string }
        dateOfBirth: { type: string, format: date }
        licenseNumber: { type: string }
        licenseState: { type: string }
        relationship: { type: string, enum: [self, spouse, child, other] }
    CoverageVerificationRequest:
      type: object
      required: [lossDate, claimType]
      properties:
        lossDate: { type: string, format: date }
        claimType: { type: string, enum: [collision, comprehensive, theft, glass, vandalism, weather, liability, other] }
        vehicleId: { type: string }
        driverId: { type: string }
    CoverageVerification:
      type: object
      required: [covered, policyId, lossDate, verifiedAt]
      properties:
        covered: { type: boolean }
        policyId: { type: string }
        lossDate: { type: string, format: date }
        coverage: { $ref: '#/components/schemas/Coverage' }
        reasons:
          type: array
          items:
            type: object
            properties:
              code: { type: string, example: POLICY_LAPSED }
              message: { type: string }
        verifiedAt: { type: string, format: date-time }
    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: number, format: double, example: 4350.00 }
        currency: { type: string, minLength: 3, maxLength: 3, example: USD }
    Address:
      type: object
      required: [addressLine1, city, state, postalCode, country]
      properties:
        addressLine1: { type: string, example: 129 W Trade St }
        addressLine2: { type: string, example: Apt 5A }
        city: { type: string, example: Charlotte }
        state: { type: string, example: NC }
        postalCode: { type: string, example: '28202' }
        country: { type: string, example: US }
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }
        traceId: { type: string }
